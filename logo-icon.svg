<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <defs>
    <!-- Background Gradient: Deep Electric Blue to Cyber Cyan -->
    <linearGradient id="sbBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="40%" stop-color="#0369A1" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Cyan to Emerald Gradient for Letter 'B' (Box) -->
    <linearGradient id="sbCyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="60%" stop-color="#22D3EE" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>

    <!-- Outer Squircle Glow -->
    <filter id="sbSquircleShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0284C7" flood-opacity="0.35"/>
    </filter>

    <!-- Glyph Drop Shadow -->
    <filter id="sbGlyphGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="3.5" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background rounded squircle with double rim -->
  <rect x="6" y="6" width="108" height="108" rx="28" fill="url(#sbBgGrad)" filter="url(#sbSquircleShadow)" />
  <rect x="6.5" y="6.5" width="107" height="107" rx="27.5" stroke="rgba(255, 255, 255, 0.35)" stroke-width="1.5" fill="none" />
  
  <!-- Subtle futuristic network speed arc -->
  <path d="M 22 96 C 12 78 16 38 42 22" stroke="rgba(255, 255, 255, 0.18)" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="3 5" fill="none" />

  <!-- Monogram S (Sony - White) & B (Box - Glowing Cyan) -->
  <g filter="url(#sbGlyphGlow)">
    <!-- Letter S (Solid, Energetic White Curve) -->
    <path d="M 50 36 C 41 29, 27 29, 24 41 C 21 53, 51 53, 50 68 C 49 81, 35 83, 24 76" 
          stroke="#FFFFFF" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />

    <!-- Letter B (Spine and Aerodynamic Dual Loops) -->
    <path d="M 58 83 L 58 33 L 74 33 C 84 33, 89 40, 89 47 C 89 54, 83 58, 73 58 L 58 58 M 72 58 L 78 58 C 88 58, 93 66, 93 74 C 93 83, 86 83, 58 83" 
          stroke="url(#sbCyanGrad)" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />

    <!-- Speed / Node Accent Points -->
    <circle cx="50" cy="36" r="3" fill="#38BDF8" />
    <circle cx="24" cy="76" r="3" fill="#34D399" />
  </g>
</svg>
