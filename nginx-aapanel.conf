# ========================================================
# SonyBox ISP - aaPanel Nginx Reverse Proxy Config (Port 22558)
# ========================================================
# aaPanel mein: Website par click karein -> "Reverse proxy" tab
# -> "Add reverse proxy":
#    Proxy Name : sonybox
#    Target URL : http://127.0.0.1:22558
#    Sent Domain: $host
#
# Agar manually Nginx configuration file mein daalna ho:

location / {
    proxy_pass http://127.0.0.1:22558;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header REMOTE-HOST $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    
    # Large payload upload support (e.g. bulk excel import & backup)
    client_max_body_size 50m;

    # Timeouts for smooth background processing
    proxy_connect_timeout 60s;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
}
